# render.yaml — Render Blueprint for Tixflow.
# Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, creates the service, and asks you for every `sync: false` value.
#
# Why these settings:
#  - ONE instance: the WhatsApp (Baileys) connection, in-memory rate limits
#    and live Event Space cache all assume a single long-running
#    `next start` process. Never scale this service to more than 1.
#  - Free plan works: the WhatsApp login is stored in MongoDB, so no disk
#    is needed. Free instances sleep after 15 idle minutes — the cron jobs
#    (every 5 min, see README) keep it awake. Change `plan` to starter for
#    an instance that never sleeps.
services:
  - type: web
    name: tixflow
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WHATSAPP_PROVIDER
        value: baileys
      # Your public URL. Leave unset to use https://<service>.onrender.com
      # automatically; set it once you add a custom domain.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_JWT_SECRET
        generateValue: true
      - key: TICKET_LOOKUP_JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: LINK_SIGNING_SECRET
        generateValue: true
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      # Ticket fee: PLATFORM_FEE_PERCENT % per ticket, never less than
      # MIN_TICKET_FEE KES. PAYOUT_FEE_PERCENT: optional cut per withdrawal (default 0).
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      - key: MIN_TICKET_FEE
        value: "20"
      - key: PAYOUT_FEE_PERCENT
        value: "0"
      # Gate gear rental rates (KES per day) shown to organisers.
      - key: RENTAL_DEVICE_PER_DAY
        value: "1500"
      - key: RENTAL_STAFF_PER_DAY
        value: "2000"
      # Where gear requests and refunds-to-send alerts are emailed.
      - key: PLATFORM_ALERT_EMAIL
        sync: false
      # IntaSend card payments. Set the IntaSend webhook to
      # {APP_URL}/api/intasend/webhook with INTASEND_WEBHOOK_CHALLENGE.
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_SECRET_KEY
        sync: false
      - key: INTASEND_ENVIRONMENT
        value: sandbox
      - key: INTASEND_WEBHOOK_CHALLENGE
        generateValue: true
      # Africa's Talking SMS (ticket links by SMS). Skipped until set.
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: MPESA_ENVIRONMENT
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_B2C_SHORTCODE
        sync: false
      - key: MPESA_B2B_SHORTCODE
        sync: false
      - key: MPESA_B2C_INITIATOR_NAME
        sync: false
      - key: MPESA_B2C_INITIATOR_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_ALLOW_PDF_DOWNLOAD
        value: "true"
      # Meta WhatsApp Cloud API — only needed once WHATSAPP_PROVIDER=cloud.
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
